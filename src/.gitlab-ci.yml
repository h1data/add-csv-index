stages:
  - build
  - test

build:
  stage: build
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - 'dist/**'
          - 'src/**'
          - templates/add-csv-index.yml
          - .gitlab-ci.yml
  before_script:
    - apk add --no-cache git
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git checkout "$CI_COMMIT_REF_NAME"
  script:
    - npm ci
    - npm run build
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add .
        git commit -m "[ci skip] updated by CI build"
        git push -f origin HEAD:$CI_COMMIT_REF_NAME
      else
        echo "no change after build"
      fi
  artifacts:
    paths:
      - dist/**

make-csv-indexed:
  stage: test
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**
          - src/**
          - test/**
          - templates/add-csv-index.yml
          - .gitlab-ci.yml
  artifacts:
    paths: [ test/out*.csv ]
  variables:
    INPUT_INPUT: test/in*.csv
    INPUT_OUTPUT: test/out*.csv
    INPUT_COLUMNS: "2"
    INPUT_SOURCE: "1"
    INPUT_HEADER: true
    INPUT_ENCODING: utf8
    INPUT_LINEFEED: CRLF
    INPUT_SEPARATOR: ","
    INPUT_QUOTE_ALWAYS: false
  before_script:
    - apk add --no-cache curl
  script:
    - mkdir -p temp
    - |
      curl -L \
      -H "Accept: application/vnd.github.raw" \
      -H "Authorization: Bearer $GITHUB_TOKEN" \
      -H "X-GitHub-Api-Version: 2026-03-10" \
      https://api.github.com/repos/h1data/add-csv-index/contents/dist/gitlab/index.js \
      -o temp/index.js
    - node temp/index.js

validate:
  stage: test
  image: alpine:latest
  needs:
    - job: make-csv-indexed
      optional: true
      artifacts: true
  rules:
    - changes:
        paths:
          - dist/**
          - src/**
          - test/**
          - templates/add-csv-index.yml
          - .gitlab-ci.yml
  script:
    - apk add --no-cache diffutils
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/output.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/output_expected.csv test/output.csv || (echo "CSV mismatch" && exit 1)

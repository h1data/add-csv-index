# CI script for GitHub Actions

name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitlab-ci.yml'
  workflow_dispatch:

jobs:

  test-1:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Execute Action
          id: execute
          uses: ./
          with:
            input: test/1_input.csv
            output: test/1_output.csv
            columns: "2"
        - name: Display the result
          run: |
            echo "lines: ${{ steps.execute.outputs.lines }}"
            echo "${{ steps.execute.outputs.output }}: "
            cat ${{ steps.execute.outputs.output }}
        - name: Compare outputs with expecting
          run: |
            result=0
            if [[ ${{ steps.execute.outputs.lines }} =~ [0-9]+ ]]; then
              echo "[OK] lines is number"
            else
              echo "[NG] lines is not number"
              result=1
            fi

            diff test/1_output_expected.csv ${{ steps.execute.outputs.output }} -q
            compare=$?
            if [ $compare -eq 0 ]; then
              echo "[OK] Created CSV is the same as the expecting"
            else
              echo "[NG] Created CSV is not the same as the expecting"
              result=1
            fi
            exit $result

  test-2:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Execute Action
          id: execute
          uses: ./
          with:
            input: test/*_input.csv
            output: test/*_output.csv
            columns: "1,2"
            source: "0"
            header: false
            utf_bom: true
            linefeed: LF
        - name: Display the result
          run: |
            echo "lines: ${{ steps.execute.outputs.lines }}"
            echo "${{ steps.execute.outputs.output }}: "
            cat ${{ steps.execute.outputs.output }}
        - name: Compare outputs with expecting
          run: |
            result=0
            if [[ ${{ steps.execute.outputs.lines }} =~ [0-9]+ ]]; then
              echo "[OK] lines is number"
            else
              echo "[NG] lines is not number"
              result=1
            fi

            diff test/2_output_expected.csv test/2_output.csv -q
            compare=$?
            if [ $compare -eq 0 ]; then
              echo "[OK] Created CSV is the same as the expecting"
            else
              echo "[NG] Created CSV is not the same as the expecting"
              result=1
            fi
            exit $result
